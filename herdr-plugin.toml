id = "rpbaptist.herdr-chat-view"
name = "Chat view"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Chat view on agent sessions, drawn with pixel. Toggle between the terminal and the chat."
platforms = ["linux", "macos"]

# Run from the agent pane or its chat pane. The view that does not show waits in
# a tab of its own. The first run opens the chat in the slot of the agent pane;
# later runs swap the two views.
[[actions]]
id = "toggle"
title = "Chat view: toggle terminal / chat"
contexts = ["pane"]
command = ["bun", "herdr-chat.ts", "toggle"]

[[actions]]
id = "close"
title = "Chat view: close"
contexts = ["pane"]
command = ["bun", "herdr-chat.ts", "close"]

# After a herdr restart, a chat pane comes back as a plain shell: give its agent
# the slot back and close the shell.
[[startup]]
command = ["bun", "herdr-chat.ts", "restore"]

# Opened by the toggle action with HERDR_CHAT_URL set.
[[panes]]
id = "chat"
title = "chat"
placement = "tab"
command = ["bash", "chat-pane.sh"]
